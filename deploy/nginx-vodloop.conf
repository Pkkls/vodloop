# TLS front for the vodloop dashboard, which itself listens on loopback only.
# The existing site on this host is a catch-all server block; an exact
# server_name is matched before a default server, so this takes precedence for
# its own hostname without touching the other one.
#
# certbot --nginx rewrites this file to add the certificate and the port 443
# block. Keep the rate limits and headers below when it does.

limit_req_zone $binary_remote_addr zone=vodloop_api:1m rate=10r/s;

server {
    listen 80;
    server_name vodloop.kicknosubviewer.duckdns.org;

    # the panel controls a live stream, so keep it out of search results
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # a stray large body has no reason to reach a JSON control API
    client_max_body_size 16k;

    location /api/ {
        # blunts token guessing without getting in a real operator's way
        limit_req zone=vodloop_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
    }

    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
    }
}
